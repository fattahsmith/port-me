<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" style="background:#e63946">
  <!-- Spider-Man placeholder — replace with real edited photo at public/images/profile/profile-spiderman.jpg -->
  <rect width="400" height="400" fill="#e63946"/>
  <!-- mask shape -->
  <ellipse cx="200" cy="160" rx="90" ry="100" fill="#e63946" stroke="#fff" stroke-width="3"/>
  <!-- web lines -->
  <line x1="200" y1="60" x2="200" y2="260" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <line x1="110" y1="110" x2="290" y2="210" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <line x1="110" y1="210" x2="290" y2="110" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <ellipse cx="200" cy="160" rx="40" ry="50" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <ellipse cx="200" cy="160" rx="70" ry="80" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <!-- eyes -->
  <ellipse cx="168" cy="145" rx="22" ry="16" fill="white"/>
  <ellipse cx="232" cy="145" rx="22" ry="16" fill="white"/>
  <!-- eye glint -->
  <ellipse cx="162" cy="140" rx="8" ry="5" fill="#ccc" opacity="0.5"/>
  <ellipse cx="226" cy="140" rx="8" ry="5" fill="#ccc" opacity="0.5"/>
  <!-- body hint -->
  <rect x="140" y="265" width="120" height="120" rx="8" fill="#1d3557" opacity="0.6"/>
  <!-- label -->
  <text x="200" y="340" text-anchor="middle" font-family="monospace" font-size="11" fill="white" opacity="0.9">Replace with edited photo</text>
  <text x="200" y="356" text-anchor="middle" font-family="monospace" font-size="10" fill="white" opacity="0.7">public/images/profile/profile-spiderman.jpg</text>
</svg>
